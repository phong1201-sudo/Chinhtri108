<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b0122b">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Chụp là ra đáp án</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap');
:root{--bg:#14110c;--surface:#211d16;--surface2:#2a251d;--ink:#f2ede2;--muted:#a89e8c;--line:#3a3327;--accent:#f2647c;--accent2:#b0122b;--ok:#34d17f;--ok-bg:#12301f;--ok-line:#2a6a44;--warn:#e8a54a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
#app{display:flex;flex-direction:column;min-height:100%}
.top{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:9px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.dot{width:11px;height:11px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 3px rgba(242,100,124,.2)}
.top b{font-size:16px;font-weight:800}.top .st{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.body{flex:1;display:flex;flex-direction:column;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:16px}
.shot{width:100%;border-radius:14px;border:1px solid var(--line);display:none}
.snap{border:none;background:var(--accent2);color:#fff;border-radius:16px;padding:20px;font:inherit;font-size:19px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(176,18,43,.4)}
.snap:active{transform:scale(.98)}.snap .cam{font-size:26px}
.row2{display:flex;gap:10px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.98)}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0}
.pill{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1.5px solid var(--ok-line);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.pill .pn{background:var(--surface2);color:var(--muted);font-weight:800;font-size:18px;padding:8px 11px;display:flex;align-items:center}
.pill .pa{background:var(--ok-bg);color:var(--ok);font-weight:800;font-size:26px;padding:6px 14px;display:flex;align-items:center;min-width:44px;justify-content:center}
.pill.low{border-color:var(--warn)}.pill.low .pa{color:var(--warn);background:#2e2410}
.sub{text-align:center;font-size:13px;color:var(--muted)}
.row{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start}
.row.low{border-color:var(--warn)}
.rb{flex:none;width:42px;height:42px;border-radius:10px;background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok-line);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}
.rb.low{color:var(--warn);border-color:var(--warn);background:#2e2410}
.rmeta{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);margin-bottom:2px}
.rq{font-size:13px;color:var(--ink)}.rq .lbl{color:var(--muted);font-weight:500}
.flag{font-size:11px;color:var(--warn);font-weight:700;margin-top:3px}
.detail{display:flex;flex-direction:column;gap:9px}
.status{text-align:center;font-size:13px;color:var(--muted);min-height:20px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:8px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{text-align:center;color:var(--muted);font-size:14px;padding:10px 6px}.hero .em{font-size:40px}
</style></head>
<body><div id="app">
  <div class="top"><span class="dot"></span><b>Chụp là ra đáp án</b><span class="st" id="st">498 câu</span></div>
  <div class="body">
    <button class="snap" id="snap"><span class="cam">📷</span> Chụp ảnh câu hỏi</button>
    <div class="row2"><button class="btn" id="pick">🖼️ Chọn ảnh</button></div>
    <img class="shot" id="shot" alt="">
    <div class="bar" id="barwrap" hidden><i id="bar"></i></div>
    <div class="status" id="status"></div>
    <div class="pills" id="pills"></div>
    <div class="sub" id="sub"></div>
    <div class="detail" id="detail"></div>
    <div class="hero" id="hero"><div class="em">📸</div>Bấm <b>Chụp ảnh câu hỏi</b>, chụp rõ cả <b>câu hỏi và các phương án A/B/C/D</b>. App báo chữ cái đúng <b>theo thứ tự đáp án trong ảnh</b>.</div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </div>
</div>

ện đại.","w":false},{"n":65,"set":"Chính trị","q":"Nội dung nào sau đây là đột phá thứ hai được xác định trong Nghị quyết Đại hội Đảng bộ Quân đội lần thứ XII?","qn":"noi dung nao sau day la dot pha thu hai duoc xac dinh trong nghi quyet dai hoi dang bo quan doi lan thu xii","c":"B","ct":"Tập trung phát triển nguồn nhân lực chất lượng cao; đẩy mạnh thu hút, trọng dụng nhân tài, xây dựng đội ngũ cán bộ đáp ứng yêu cầu xây dựng quân đội hiện đại; nâng cao chất lượng xây dựng chính quy, quản lý kỷ luật; phát huy giá trị văn hóa “Bộ đội Cụ Hồ” thời kỳ mới.","w":false},{"n":66,"set":"Chính trị","q":"Đột phá thứ ba được xác định trong Nghị quyết Đại hội Đảng bộ Quân đội lần thứ XII là nội dung nào sau đây?","qn":"dot pha thu ba duoc xac dinh trong nghi quyet dai hoi dang bo quan doi lan thu xii la noi dung nao sau day","c":"C","ct":"Đẩy mạnh phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số; phát triển công nghiệp quốc phòng tự chủ, tự lực, tự cường, lưỡng dụng, hiện đại.","w":false},{"n":67,"set":"Chính trị","q":"Thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại là điều kiện cơ bản bảo đảm cho quân đội ta luôn đạt được yêu cầu nào sau đây?","qn":"thuc hien bo tieu chi quan doi nhan dan viet nam hien dai la dieu kien co ban bao dam cho quan doi ta luon dat duoc yeu cau nao sau day","c":"B","ct":"Vững mạnh về chính trị; giữ vững và tăng cường sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng, sự quản lý tập trung, thống nhất của Nhà nước đối với Quân đội nhân dân.","w":false},{"n":68,"set":"Chính trị","q":"Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại sẽ là động lực để phát huy yếu tố nào của các tập thể, cá nhân trong thực hiện nhiệm vụ được giao?","qn":"bo tieu chi quan doi nhan dan viet nam hien dai se la dong luc de phat huy yeu to nao cua cac tap the ca nhan trong thuc hien nhiem vu duoc giao","c":"B","ct":"Trách nhiệm, trí tuệ, sức sáng tạo, tinh thần tự lực, tự cường, đoàn kết, thống nhất, khắc phục khó khăn.","w":false},{"n":69,"set":"Chính trị","q":"Nội hàm cốt lõi của nhiệm vụ bảo vệ Tổ quốc trong tình hình mới bao gồm những nội dung nào?","qn":"noi ham cot loi cua nhiem vu bao ve to quoc trong tinh hinh moi bao gom nhung noi dung nao","c":"D","ct":"Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc; bảo vệ Đảng, Nhà nước, nhân dân và chế độ xã hội chủ nghĩa; giữ vững môi trường hòa bình, ổn định để xây dựng, phát triển đất nước.","w":false},{"n":70,"set":"Chính trị","q":"Nhiệm vụ bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới là trách nhiệm chính trị của chủ thể nào?","qn":"nhiem vu bao ve to quoc viet nam xa hoi chu nghia trong tinh hinh moi la trach nhiem chinh tri cua chu the nao","c":"A","ct":"Toàn Đảng, toàn dân và toàn quân.","w":false},{"n":71,"set":"Chính trị","q":"Trong nhiệm vụ bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa ở tình hình mới, lực lượng nào giữ vai trò nòng cốt?","qn":"trong nhiem vu bao ve to quoc viet nam xa hoi chu nghia o tinh hinh moi luc luong nao giu vai tro nong cot","c":"A","ct":"Lực lượng vũ trang nhân dân, trước hết là Quân đội nhân dân và Công an nhân dân.","w":false},{"n":72,"set":"Chính trị","q":"Trước sự phát triển mạnh mẽ của cuộc Cách mạng công nghiệp lần thứ tư, đòi hỏi phải thực hiện nội dung nào dưới đây?","qn":"truoc su phat trien manh me cua cuoc cach mang cong nghiep lan thu tu doi hoi phai thuc hien noi dung nao duoi day","c":"A","ct":"Thay đổi cơ cấu tổ chức quân đội và trang bị vũ khí.","w":false},{"n":73,"set":"Chính trị","q":"Những năm qua, Quân ủy Trung ương, Bộ Quốc phòng và các cơ quan chức năng xác định việc thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại giữ vị trí như thế nào trong hoạt động của các cơ quan, đơn vị?","qn":"nhung nam qua quan uy trung uong bo quoc phong va cac co quan chuc nang xac dinh viec thuc hien bo tieu chi quan doi nhan dan viet nam hien dai giu vi tri nhu the nao trong hoat dong cua cac co quan don vi","c":"B","ct":"Một trong những nhiệm vụ chính trị trọng tâm, xuyên suốt.","w":false},{"n":74,"set":"Chính trị","q":"Trong chất lượng thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại ở một số cơ quan, đơn vị còn tồn tại hạn chế nào sau đây?","qn":"trong chat luong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai o mot so co quan don vi con ton tai han che nao sau day","c":"B","ct":"Chất lượng thực hiện Bộ tiêu chí trên một số mặt, nội dung hoạt động còn hạn chế, nhất là chất lượng xây dựng chính quy và quản lý kỷ luật bộ đội ở một số cơ quan, đơn vị chưa tạo được sự chuyển biến vững chắc, chưa đạt được các chỉ tiêu phấn đấu đề ra.","w":false},{"n":75,"set":"Chính trị","q":"Việc quán triệt sâu sắc và nắm vững quan điểm, đường lối của Đảng, chủ trương của Quân ủy Trung ương, Bộ Quốc phòng về Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại có vị trí như thế nào?","qn":"viec quan triet sau sac va nam vung quan diem duong loi cua dang chu truong cua quan uy trung uong bo quoc phong ve bo tieu chi quan doi nhan dan viet nam hien dai co vi tri nhu the nao","c":"A","ct":"Yêu cầu cơ bản nhất, bảo đảm việc nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí theo đúng định hướng chính trị, thực chất và hiệu quả.","w":false},{"n":76,"set":"Chính trị","q":"Trong yêu cầu quán triệt sâu sắc đường lối của Đảng, quân nhân cần nắm vững chỉ thị nào của Bộ trưởng Bộ Quốc phòng về xây dựng đơn vị vững mạnh toàn diện “mẫu mực, tiêu biểu”?","qn":"trong yeu cau quan triet sau sac duong loi cua dang quan nhan can nam vung chi thi nao cua bo truong bo quoc phong ve xay dung don vi vung manh toan dien mau muc tieu bieu","c":"D","ct":"Chỉ thị số 79/CT-BQP ngày 22 tháng 7 năm 2022.","w":false},{"n":77,"set":"Chính trị","q":"Việc bám sát thực tiễn hoạt động của các cơ quan, đơn vị để nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại có vị trí, vai trò như thế nào?","qn":"viec bam sat thuc tien hoat dong cua cac co quan don vi de nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai co vi tri vai tro nhu the nao","c":"D","ct":"Yêu cầu quan trọng, có ý nghĩa trực tiếp quyết định việc nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí.","w":false},{"n":78,"set":"Chính trị","q":"Để bám sát thực tiễn hoạt động, các đơn vị trong toàn quân cần bám sát yếu tố nào nhằm nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại?","qn":"de bam sat thuc tien hoat dong cac don vi trong toan quan can bam sat yeu to nao nham nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai","c":"A","ct":"Diễn biến các cuộc xung đột quân sự trên thế giới hiện nay.","w":false},{"n":79,"set":"Chính trị","q":"Kết hợp chặt chẽ phong trào thi đua quyết thắng, các cuộc vận động và việc đẩy mạnh học tập, làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh với nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại có ý nghĩa như thế nào?","qn":"ket hop chat che phong trao thi dua quyet thang cac cuoc van dong va viec day manh hoc tap lam theo tu tuong dao duc phong cach ho chi minh voi nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai co y nghia nhu the nao","c":"D","ct":"Có ý nghĩa đặc biệt quan trọng nhằm tạo ra động lực to lớn, cổ vũ, động viên, thúc đẩy các tập thể, cá nhân nỗ lực phấn đấu để thực hiện thắng lợi Bộ tiêu chí.","w":false},{"n":80,"set":"Chính trị","q":"Việc tiến hành thường xuyên, liên tục, kết hợp chặt chẽ giữa “xây” và “chống”, lấy “xây” là chính để nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại” giữ vị trí, vai trò như thế nào?","qn":"viec tien hanh thuong xuyen lien tuc ket hop chat che giua xay va chong lay xay la chinh de nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai giu vi tri vai tro nhu the nao","c":"B","ct":"Vừa là yêu cầu có tính nguyên tắc, vừa là quan điểm, phương châm chỉ đạo phòng ngừa, phát hiện, ngăn chặn những nhận thức lệch lạc, xử lý các biểu hiện vi phạm trong quá trình thực hiện Bộ tiêu chí.","w":false},{"n":81,"set":"Chính trị","q":"Việc tăng cường sự lãnh đạo, chỉ đạo, hướng dẫn của cấp ủy, tổ chức đảng, chính ủy, chính trị viên, người chỉ huy và cơ quan chính trị các cấp đối với việc nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại giữ vị trí, ý nghĩa như thế nào?","qn":"viec tang cuong su lanh dao chi dao huong dan cua cap uy to chuc dang chinh uy chinh tri vien nguoi chi huy va co quan chinh tri cac cap doi voi viec nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai giu vi tri y nghia nhu the nao","c":"B","ct":"Giải pháp quan trọng hàng đầu, bao trùm, xuyên suốt, có ý nghĩa quyết định đối với việc nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí.","w":false},{"n":82,"set":"Chính trị","q":"Để thực hiện tốt giải pháp tăng cường sự lãnh đạo, chỉ đạo đối với việc nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại, cấp ủy, chỉ huy các cơ quan, đơn vị cần thực hiện nội dung nào sau đây?","qn":"de thuc hien tot giai phap tang cuong su lanh dao chi dao doi voi viec nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai cap uy chi huy cac co quan don vi can thuc hien noi dung nao sau day","c":"D","ct":"Đổi mới phong cách lãnh đạo, sâu sát cơ sở, thường xuyên nắm bắt, đánh giá đúng thực trạng nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí ở cơ quan, đơn vị mình.","w":false},{"n":83,"set":"Chính trị","q":"Trách nhiệm của cơ quan chính trị các cấp đối với việc nâng cao nhận thức, trách nhiệm của co so nen tang de nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai giu vi tri vai tro gi","c":"B","ct":"Giải pháp có vai trò rất quan trọng, tạo ra những tiền đề, môi trường thuận lợi để nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí.","w":false},{"n":90,"set":"Chính trị","q":"Trong xây dựng môi trường văn hóa quân sự để nâng cao nhận thức, trách nhiệm của quân nhân trong thực hiện Bộ tiêu chí Quân đội nhân dân Việt Nam hiện đại, cần phải làm cho mỗi quân nhân luôn có ý thức và thực hiện phương châm nào?","qn":"trong xay dung moi truong van hoa quan su de nang cao nhan thuc trach nhiem cua quan nhan trong thuc hien bo tieu chi quan doi nhan dan viet nam hien dai can phai lam cho moi quan nhan luon co y thuc va thuc hien phuong cham nao","c":"B","ct":"“Sống theo pháp luật, hành động theo điều lệnh, làm việc theo chức trách”, “mỗi người vì mọi người, mọi người vì mỗi người”.","w":false},{"n":91,"set":"Chính trị","q":"Quân đội tham gia lao động sản xuất, kết hợp quốc phòng với kinh tế - xã hội trong kỷ nguyên mới là gì?","qn":"quan doi tham gia lao dong san xuat ket hop quoc phong voi kinh te xa hoi trong ky nguyen moi la gi","c":"A","ct":"Tổng thể hoạt động thực hiện chức năng, nhiệm vụ cơ bản, thể hiện bản chất, truyền thống của Quân đội nhằm gắn kết và phát huy sức mạnh quốc phòng, gia tăng tiềm lực của quốc gia, tính tự chủ của đất nước trong xây dựng Quân đội và củng cố quốc phòng, mở rộng hội nhập quốc tế, nâng cao vị thế quốc gia trên trường quốc tế.","w":false},{"n":92,"set":"Chính trị","q":"Theo quan điểm của chủ nghĩa Mác - Lênin, chức năng của quân đội kiểu mới của giai cấp vô sản có đặc điểm gì?","qn":"theo quan diem cua chu nghia mac lenin chuc nang cua quan doi kieu moi cua giai cap vo san co dac diem gi","c":"D","ct":"Không chỉ dừng lại ở nhiệm vụ chiến đấu bảo vệ thành quả cách mạng mà còn phải là lực lượng lao động sản xuất, kiến thiết đất nước.","w":false},{"n":93,"set":"Chính trị","q":"Chủ tịch Hồ Chí Minh khẳng định Quân đội nhân dân Việt Nam là một đội quân cách mạng kiểu mới mang bản chất giai cấp công nhân với đặc trưng cốt lõi nào?","qn":"chu tich ho chi minh khang dinh quan doi nhan dan viet nam la mot doi quan cach mang kieu moi mang ban chat giai cap cong nhan voi dac trung cot loi nao","c":"A","ct":"Là Quân đội nhân dân, do dân đẻ ra, vì dân mà chiến đấu, yêu nước, yêu dân.","w":false},{"n":94,"set":"Chính trị","q":"Thực hiện tư tưởng chỉ đạo của Chủ tịch Hồ Chí Minh, Quân đội nhân dân Việt Nam đã trở thành mô hình độc đáo, sáng tạo, hoàn thành xuất sắc ba chức năng nào sau đây?","qn":"thuc hien tu tuong chi dao cua chu tich ho chi minh quan doi nhan dan viet nam da tro thanh mo hinh doc dao sang tao hoan thanh xuat sac ba chuc nang nao sau day","c":"B","ct":"Đội quân chiến đấu, đội quân công tác và đội quân lao động sản xuất.","w":false},{"n":95,"set":"Chính trị","q":"Xây dựng kinh tế kết hợp với quốc phòng được hiểu là nội dung nào sau đây?","qn":"xay dung kinh te ket hop voi quoc phong duoc hieu la noi dung nao sau day","c":"A","ct":"Sự phát triển kinh tế gắn liền với tăng cường quốc phòng, an ninh nhằm xây dựng và bảo vệ Tổ quốc vững mạnh, đặc biệt là trên các địa bàn chiến lược, biên giới và hải đảo.","w":false},{"n":96,"set":"Chính trị","q":"Truyền thống dựng nước đi đôi với giữ nước của dân tộc Việt Nam được kế thừa và phát triển qua các thời kỳ, trở thành nội dung nào sau đây?","qn":"truyen thong dung nuoc di doi voi giu nuoc cua dan toc viet nam duoc ke thua va phat trien qua cac thoi ky tro thanh noi dung nao sau day","c":"B","ct":"Hai nhiệm vụ chiến lược xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","w":false},{"n":97,"set":"Chính trị","q":"Trong bản chất, truyền thống của Quân đội nhân dân Việt Nam, nhiệm vụ lao động sản xuất, xây dựng kinh tế giữ vị trí gì?","qn":"trong ban chat truyen thong cua quan doi nhan dan viet nam nhiem vu lao dong san xuat xay dung kinh te giu vi tri gi","c":"A","ct":"M nh khu kinh tế - quốc phòng thể hiện tư duy lý luận nào sau đây?","qn":"viec quan doi chu dong kien tao mo hinh khu kinh te quoc phong the hien tu duy ly luan nao sau day","c":"D","ct":"Tư duy biện chứng giữa xây dựng và bảo vệ Tổ quốc, giữa phát triển lực lượng sản xuất với tăng cường tiềm lực quốc phòng trong điều kiện mới.","w":false},{"n":104,"set":"Chính trị","q":"Công nghiệp quốc phòng giữ vai trò kép nào đối với đất nước?","qn":"cong nghiep quoc phong giu vai tro kep nao doi voi dat nuoc","c":"A","ct":"Vừa là nền tảng bảo đảm tiềm lực quân sự, vừa là động lực thúc đẩy quá trình công nghiệp hóa, hiện đại hóa đất nước.","w":false},{"n":105,"set":"Chính trị","q":"Tính tiên phong trong phát triển công nghiệp quốc phòng được thể hiện rõ ở định hướng phát triển theo mô hình nào?","qn":"tinh tien phong trong phat trien cong nghiep quoc phong duoc the hien ro o dinh huong phat trien theo mo hinh nao","c":"B","ct":"Mô hình lưỡng dụng, gắn kết chặt chẽ giữa công nghiệp quốc phòng với công nghiệp dân dụng, hình thành hệ thống sản xuất tổng hợp, tự chủ, đáp ứng yêu cầu của thời bình và thời chiến.","w":false},{"n":106,"set":"Chính trị","q":"Các doanh nghiệp quân đội trong thực hiện nhiệm vụ sản xuất kinh doanh vận hành theo cơ chế nào?","qn":"cac doanh nghiep quan doi trong thuc hien nhiem vu san xuat kinh doanh van hanh theo co che nao","c":"B","ct":"Cơ chế thị trường định hướng xã hội chủ nghĩa.","w":false},{"n":107,"set":"Chính trị","q":"Quân đội xác định hoạt động tăng gia sản xuất tại các đơn vị là nội dung có tính chất gì?","qn":"quan doi xac dinh hoat dong tang gia san xuat tai cac don vi la noi dung co tinh chat gi","c":"C","ct":"Một giải pháp mang tính chiến lược, kết hợp chặt chẽ giữa thực hiện nhiệm vụ quốc phòng với phát triển kinh tế - xã hội.","w":false},{"n":108,"set":"Chính trị","q":"Nội dung tiên phong thứ năm của Quân đội tham gia lao động sản xuất gắn liền với những lĩnh vực trọng tâm nào?","qn":"noi dung tien phong thu nam cua quan doi tham gia lao dong san xuat gan lien voi nhung linh vuc trong tam nao","c":"C","ct":"Thực hiện phát triển bền vững, ứng phó biến đổi khí hậu, khắc phục hậu quả thiên tai và mở rộng hợp tác quốc tế.","w":false},{"n":109,"set":"Chính trị","q":"Theo phân loại các hình thức cơ bản, hình thức tham gia lao động sản xuất trực tiếp của Quân đội bao gồm những cơ quan, đơn vị nào?","qn":"theo phan loai cac hinh thuc co ban hinh thuc tham gia lao dong san xuat truc tiep cua quan doi bao gom nhung co quan don vi nao","c":"B","ct":"Các đoàn kinh tế quốc phòng, các tổng công ty, công ty, tập đoàn, doanh nghiệp quân đội.","w":false},{"n":110,"set":"Chính trị","q":"Hình thức tham gia lao động sản xuất gián tiếp của Quân đội bao gồm những hoạt động nào sau đây?","qn":"hinh thuc tham gia lao dong san xuat gian tiep cua quan doi bao gom nhung hoat dong nao sau day","c":"B","ct":"Tăng gia sản xuất ở đơn vị, giúp nhân dân phòng chống thiên tai, lũ lụt, xóa đói giảm nghèo, xây dựng nông thôn mới.","w":false},{"n":111,"set":"Chính trị","q":"Việc tăng cường sự lãnh đạo, chỉ đạo của cấp ủy, chỉ huy các cấp đối với nhiệm vụ tham gia lao động sản xuất, kết hợp quốc phòng với kinh tế - xã hội giữ vị trí, ý nghĩa như thế nào?","qn":"viec tang cuong su lanh dao chi dao cua cap uy chi huy cac cap doi voi nhiem vu tham gia lao dong san xuat ket hop quoc phong voi kinh te xa hoi giu vi tri y nghia nhu the nao","c":"A","ct":"Giải pháp quan trọng hàng đầu, quyết định thực hiện thắng lợi nhiệm vụ, đảm bảo cho mọi hoạt động tham gia sản xuất, xây dựng kinh tế của quân đội đúng định hướng, đạt hiệu quả cao.","w":false},{"n":112,"set":"Chính trị","q":"Trong giải pháp tăng cường lãnh đạo, chỉ đạo, cấp ủy, chỉ huy các cấp đối với nhiệm vụ tham gia lao động sản xuất, kết hợp quốc phòng với kinh tế -xã hội cần đặc biệt phát huy vai trò của Ban Chỉ đạo 35 và Lực lượng 47 vào nhiệm vụ nào?","qn":"trong giai phap tang cuong lanh dao chi dao cap uy chi huy cac cap doi voi nhiem vu tham gia lao dong san xuat ket hop quoc phong voi kinh te xa hoi can dac biet phat huy vai tro cua ban chi dao 35 va luc luong 47 vao nhiem vu nao","c":"C","ct":"Chủ động, kiên quyết đấu tranh, phản bác các quan điểm sai trái của các thế lực thù địch, phản động.","w":false},{"n":113,"set":"Chính trị","q":"Việc tập trung nguồn lực, đẩy nhanh tiến độ xây dựng và nâng cao hiệu quả hoạt động của các khu kinh tế - quốc phòng có vị trí, ý nghĩa như thế nào?","qn":"viec tap trung nguon luc day nhanh tien do xay dung va nang cao hieu qua hoat dong cua cac khu kinh te quoc phong co vi tri y nghia nhu the nao","c":"B","ct":"Giải pháp quan trọng, vấn đề có ý nghĩa chiến lược lâu dài của quân đội ta nhằm tăng cường thế trận quốc phòng, an ninh, nhất là “thế trận lòng dân” để xây dựng và bảo vệ biên giới gắn với đẩy mạnh phát triển kinh tế - xã hội, củng cố hệ thống chính trị ở cơ sở, nâng cao đời sống vật chất, tinh thần của nhân dân, xóa đói giảm nghèo bền vững.","w":false},{"n":114,"set":"Chính trị","q":"Trong giải pháp xây dựng khu kinh tế - quốc phòng, định hướng ưu tiên đầu tư như thế nào?","qn":"trong giai phap xay dung khu kinh te quoc phong dinh huong uu tien dau tu nhu the nao","c":"B","ct":"Ưu tiên xây dựng các khu kinh tế - quốc phòng trên hướng biển, đảo, xa bờ.","w":false},{"n":115,"set":"Chính trị","q":"Mục tiêu của việc phân định rõ chức năng, nhiệm vụ chính trị của đoàn kinh tế - quốc phòng với chức năng sản xuất, kinh doanh của doanh nghiệp là gì?","qn":"muc tieu cua viec phan dinh ro chuc nang nhiem vu chinh tri cua doan kinh te quoc phong voi chuc nang san xuat kinh doanh cua doanh nghiep la gi","c":"D","ct":"Nhằm mục tiêu để đoàn kinh tế - quốc phòng tập trung vào thực hiện nhiệm vụ chính trị trung tâm.","w":false},{"n":116,"set":"Chính trị","q":"Việc đẩy mạnh sắp xếp, đổi mới, phát triển và nâng cao hiệu quả sản xuất, kinh doanh của các doanh nghiệp quân đội giữ vị trí, vai trò như thế nào?","qn":"viec day manh sap xep doi moi phat trien va nang cao hieu qua san xuat kinh doanh cua cac doanh nghiep quan  for(const q of BANK){let s=0,mW=0,tW=0;for(const t of toks){const iw=w(t);tW+=iw;if(q.qn.includes(t))mW+=iw;}if(tW>0)s=(mW/tW)*100+mW*1.2;if(q.qn.includes(bn)&&bn.length>15)s+=60;if(s>bs){second=bs;bs=s;best=q;}else if(s>second)second=s;}
 const conf=bs<=0?0:Math.min(1,(bs/(toks.length*4+40))*(second>0?Math.min(1.4,bs/(second+1)):1.2));return{q:best,conf};}
function pickLetterVote(T,ctNorm){
 const re=/(?:^|\s)([a-f])(?=\s)/g;let m;const marks=[];
 while((m=re.exec(T))){marks.push({L:m[1].toUpperCase(),pos:m.index+m[0].length-1});}
 if(marks.length<2)return{L:null,conf:0};
 const cts=[...new Set(ctNorm.split(' ').filter(t=>t.length>=3))].sort((a,b)=>w(b)-w(a)).slice(0,8);
 const votes={};let tot=0;
 for(const t of cts){let idx=T.indexOf(' '+t+' ');if(idx>=0)idx+=1;else if(T.startsWith(t+' '))idx=0;else continue;
   let opt=null;for(const mk of marks){if(mk.pos<=idx){if(!opt||mk.pos>opt.pos)opt=mk;}}
   if(opt){votes[opt.L]=(votes[opt.L]||0)+w(t);tot+=w(t);}}
 if(!tot)return{L:null,conf:0};
 let bL=null,bV=0,sec=0;for(const k in votes){if(votes[k]>bV){sec=bV;bV=votes[k];bL=k;}else if(votes[k]>sec)sec=votes[k];}
 return{L:bL,conf:bV/(bV+sec+.001)};}
function segment(T){const re=/cau\s*(?:hoi\s*)?(\d{1,3})/g;const marks=[];let m;while((m=re.exec(T))){marks.push({num:parseInt(m[1],10),idx:m.index,end:re.lastIndex});}
 if(!marks.length)return T.trim()?[{num:null,text:T}]:[];const b=[];for(let i=0;i<marks.length;i++){const s=marks[i].end,e=i+1<marks.length?marks[i+1].idx:T.length;b.push({num:marks[i].num,text:T.slice(s,e)});}return b;}
function show(fullText){
  $('#hero').hidden=true;
  const blocks=segment(nrm(fullText));const res={};let auto=0;
  for(const bl of blocks){const {stem,opts}=splitQO(bl.text);if(stem.split(' ').length<2)continue;const r=match(stem);if(!r.q)continue;
    let letter,margin=9,fromBank=false;
    if(r.q.ct){const pk=pickLetterVote(bl.text,nrm(r.q.ct));if(pk.L){letter=pk.L;margin=pk.conf;}}
    if(!letter){letter=r.q.c;fromBank=true;margin=0;}
    const key=bl.num!=null?bl.num:('?'+(++auto));
    res[key]={letter,q:r.q,conf:r.conf,margin,fromBank};}
  const keys=Object.keys(res).sort((a,b)=>{const na=+a,nb=+b;return isNaN(na)||isNaN(nb)?(''+a).localeCompare(''+b):na-nb;});
  if(!keys.length){$('#pills').innerHTML='';$('#sub').textContent='Chưa đọc được câu — chụp gần hơn, đủ sáng, thấy rõ chữ "Câu N" và các phương án. Bấm chụp lại.';$('#detail').innerHTML='';return;}
  const isLow=r=>r.conf<0.45||r.margin<0.6||r.fromBank||r.q.w;
  $('#pills').innerHTML=keys.map(k=>{const r=res[k],low=isLow(r);return `<span class="pill ${low?'low':''}"><span class="pn">${k}</span><span class="pa">${r.q.w?'?':r.letter}</span></span>`}).join('');
  $('#sub').textContent=keys.length+' câu'+(keys.some(k=>isLow(res[k]))?' — ô viền vàng ⚠️ nên tự kiểm':'');
  $('#detail').innerHTML=keys.map(k=>{const r=res[k],low=isLow(r);
    return `<div class="row ${low?'low':''}"><div class="rb ${low?'low':''}">${r.q.w?'?':r.letter}</div><div style="flex:1"><div class="rmeta">Câu ${k} · ${esc(r.q.set)} #${r.q.n}</div>`+
    (r.q.w?`<div class="rq"><span class="lbl">Câu: </span>${esc(r.q.q.slice(0,90))}${r.q.q.length>90?'…':''}</div><div class="flag">⚠️ Nguồn KHÔNG có đáp án cho câu này — tự trả lời.</div>`
      :`<div class="rq"><span class="lbl">Đáp án đúng: </span>${esc(r.q.ct.slice(0,110))}${r.q.ct.length>110?'…':''}</div>`+
       (r.fromBank?'<div class="flag">⚠️ Không đọc được phương án trong ảnh — chữ theo ngân hàng, thứ tự đề có thể khác. Đối chiếu nội dung trên.</div>':(low?'<div class="flag">⚠️ Độ chắc thấp — đối chiếu nội dung đáp án với ảnh.</div>':'')))+
    `</div></div>`}).join('');
}
let worker=null;
async function getWorker(){if(worker)return worker;setSt('Tải OCR (lần đầu ~vài MB)…');
  worker=await Tesseract.createWorker('vie',1,{logger:m=>{if(m.status==='recognizing text'){$('#barwrap').hidden=false;$('#bar').style.width=Math.round(m.progress*100)+'%';setSt('Đọc '+Math.round(m.progress*100)+'%');}}});
  try{await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});}catch(e){}
  setSt('');return worker;}
function setSt(t){$('#status').textContent=t;}
function pre(file,cb){const img=new Image();img.onload=()=>{const vw=img.naturalWidth,vh=img.naturalHeight;const scale=Math.min(1.5,1400/(vw||1400));const c=document.createElement('canvas');c.width=vw*scale;c.height=vh*scale;const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);try{const im=g.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){const y=0.3*d[i]+0.59*d[i+1]+0.11*d[i+2];const v=y>150?255:(y<95?0:y);d[i]=d[i+1]=d[i+2]=v;}g.putImageData(im,0,0);}catch(e){}c.toBlob(b=>cb(b||file,c.toDataURL('image/jpeg',.6)),'image/png');};img.onerror=()=>cb(file,'');img.src=URL.createObjectURL(file);}
async function run(file){
  $('#pills').innerHTML='';$('#sub').textContent='';$('#detail').innerHTML='';
  $('#status').innerHTML='<div class="spin"></div>Đang xử lý ảnh…';
  pre(file,async(blob,url)=>{ if(url){$('#shot').src=url;$('#shot').style.display='';}
    try{const wk=await getWorker();const {data}=await wk.recognize(blob);$('#barwrap').hidden=true;setSt('');show(data.text);}
    catch(e){setSt('');$('#sub').textContent='Không tải được OCR — kiểm tra mạng rồi thử lại.';}
  });
}
$('#snap').onclick=()=>{$('#file').setAttribute('capture','environment');$('#file').click();};
$('#pick').onclick=()=>{$('#file').removeAttribute('capture');$('#file').click();};
$('#file').onchange=e=>{const f=e.target.files[0];if(f)run(f);e.target.value='';};
getWorker().catch(()=>{});
</script>
