<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b0122b">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Chụp là ra đáp án</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap');
:root{--bg:#14110c;--surface:#211d16;--surface2:#2a251d;--ink:#f2ede2;--muted:#a89e8c;--line:#3a3327;--accent:#f2647c;--accent2:#b0122b;--ok:#34d17f;--ok-bg:#12301f;--ok-line:#2a6a44;--warn:#e8a54a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.45}
#app{display:flex;flex-direction:column;min-height:100%}
.top{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:9px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.dot{width:11px;height:11px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 3px rgba(242,100,124,.2)}
.top b{font-size:16px;font-weight:800}.top .st{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.body{flex:1;display:flex;flex-direction:column;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:16px}
.shot{width:100%;border-radius:14px;border:1px solid var(--line);display:none}
.big{font-size:34px;font-weight:800;letter-spacing:.5px;text-align:center;line-height:1.5;word-break:break-word}
.big .n{color:var(--muted);font-size:24px;font-weight:700}.big .a{color:var(--ok)}.big .sep{color:var(--line)}
.sub{text-align:center;font-size:13px;color:var(--muted)}
.snap{border:none;background:var(--accent2);color:#fff;border-radius:16px;padding:20px;font:inherit;font-size:19px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(176,18,43,.4)}
.snap:active{transform:scale(.98)}
.snap .cam{font-size:26px}
.row2{display:flex;gap:10px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.98)}
.row{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start}
.row.low{border-color:var(--warn)}
.rb{flex:none;width:42px;height:42px;border-radius:10px;background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok-line);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}
.rmeta{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);margin-bottom:2px}
.rq{font-size:13px;color:var(--muted)}.rq b{color:var(--ink);font-weight:700}
.flag{font-size:11px;color:var(--warn);font-weight:700;margin-top:3px}
.detail{display:flex;flex-direction:column;gap:9px}
.status{text-align:center;font-size:13px;color:var(--muted);min-height:20px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:8px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{text-align:center;color:var(--muted);font-size:14px;padding:10px 6px}
.hero .em{font-size:40px}
</style></head>
<body><div id="app">
  <div class="top"><span class="dot"></span><b>Chụp là ra đáp án</b><span class="st" id="st">220 câu</span></div>
  <div class="body">
    <button class="snap" id="snap"><span class="cam">📷</span> Chụp ảnh câu hỏi</button>
    <div class="row2"><button class="btn" id="pick">🖼️ Chọn ảnh</button></div>
    <img class="shot" id="shot" alt="">
    <div class="bar" id="barwrap" hidden><i id="bar"></i></div>
    <div class="status" id="status"></div>
    <div class="big" id="big"></div>
    <div class="sub" id="sub"></div>
    <div class="detail" id="detail"></div>
    <div class="hero" id="hero"><div class="em">📸</div>Bấm <b>Chụp ảnh câu hỏi</b>, camera mở ra — chụp rõ vùng câu hỏi. Ra đáp án xong bấm chụp tiếp câu khác.</div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </div>
</div>

các Anh hùng liệt sỹ, Khu K9.","w":false},{"n":203,"q":"Tính từ khi mở cửa Lăng ngày 29/8/1975 đến hết ngày 30/6/2024, Lăng Chủ tịch Hồ Chí Minh đã đón tiếp số lượng khách là bao nhiêu?","qn":"tinh tu khi mo cua lang ngay 29 8 1975 den het ngay 30 6 2024 lang chu tich ho chi minh da don tiep so luong khach la bao nhieu","c":"C","ct":"Đã đón tiếp gần 70 triệu lượt khách.","w":false},{"n":204,"q":"Theo Pháp lệnh Bảo vệ công trình quốc phòng và khu quân sự năm 1994, các công trình lưu giữ lâu dài thi hài Chủ tịch Hồ Chí Minh được xếp thuộc nhóm công trình nào?","qn":"theo phap lenh bao ve cong trinh quoc phong va khu quan su nam 1994 cac cong trinh luu giu lau dai thi hai chu tich ho chi minh duoc xep thuoc nhom cong trinh nao","c":"A","ct":"Công trình quốc phòng và khu quân sự Nhóm I.","w":false},{"n":205,"q":"Bố cục tổng thể của Pháp lệnh Quản lý, bảo vệ Khu Di tích Lăng Chủ tịch Hồ Chí Minh bao gồm bao nhiêu chương và bao nhiêu điều?","qn":"bo cuc tong the cua phap lenh quan ly bao ve khu di tich lang chu tich ho chi minh bao gom bao nhieu chuong va bao nhieu dieu","c":"B","ct":"6 Chương, 32 Điều.","w":false},{"n":206,"q":"Phạm vi đối tượng áp dụng của Pháp lệnh Quản lý, bảo vệ Khu Di tích Lăng Chủ tịch Hồ Chí Minh?","qn":"pham vi doi tuong ap dung cua phap lenh quan ly bao ve khu di tich lang chu tich ho chi minh","c":"C","ct":"Cơ quan, tổ chức, đơn vị lực lượng vũ trang, công dân Việt Nam và cá nhân, tổ chức nước ngoài có liên quan.","w":false},{"n":207,"q":"Theo quy định của Pháp lệnh Quản lý, bảo vệ Khu Di tích Lăng Chủ tịch Hồ Chí Minh, người nào có thẩm quyền quy định chi tiết nội dung bảo đảm an ninh, an toàn thi hài Chủ tịch Hồ Chí Minh?","qn":"theo quy dinh cua phap lenh quan ly bao ve khu di tich lang chu tich ho chi minh nguoi nao co tham quyen quy dinh chi tiet noi dung bao dam an ninh an toan thi hai chu tich ho chi minh","c":"D","ct":"Bộ trưởng Bộ Quốc phòng.","w":false},{"n":208,"q":"Chủ thể nào có thẩm quyền quyết định thành lập Hội đồng khoa học cấp
